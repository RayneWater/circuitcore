<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CircuitCore — Triage & Sourcing Hub</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#f97316',
              blue: '#38bdf8',
              dark: '#0f172a',
              card: '#1e293b',
              border: '#334155'
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    .boot-pulse { animation: pulseGlow 2s infinite ease-in-out; }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">

  <!-- Full Launch Animation Boot Screen -->
  <div id="bootScreen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center transition-opacity duration-700">
    <div class="relative flex items-center justify-center mb-6">
      <div class="absolute w-28 h-28 rounded-full bg-orange-500/20 blur-xl boot-pulse"></div>
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-orange-500 to-sky-400 flex items-center justify-center shadow-lg shadow-orange-500/20 border border-white/20">
        <i class="fa-solid fa-microchip text-2xl text-slate-950"></i>
      </div>
    </div>
    <h1 class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-amber-200 to-sky-400">
      CIRCUITCORE
    </h1>
    <p class="text-xs text-slate-400 mt-2 font-mono tracking-widest uppercase">Electronics Triage Engine</p>
    <div class="mt-6 flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-800 text-[11px] text-sky-400">
      <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-ping"></span>
      Created by RayneWater
    </div>
  </div>

  <!-- Sticky Top Header -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-orange-500 to-sky-400 flex items-center justify-center text-slate-950 font-bold shadow-sm">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-base tracking-wide text-white">CircuitCore</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-orange-500/20 text-orange-400 border border-orange-500/30 font-mono">v1.2</span>
        </div>
        <p class="text-[10px] text-slate-400">Created by <span class="text-sky-400 font-medium">RayneWater</span></p>
      </div>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <span class="px-2.5 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5 font-mono text-[11px]">
        <i class="fa-solid fa-plane-arrival"></i> SG Free Freight
      </span>
    </div>
  </header>

  <!-- Main Nav Tabs -->
  <nav class="bg-slate-900/80 border-b border-slate-800 px-2 flex justify-around text-xs sticky top-[57px] z-30 backdrop-blur-sm">
    <button onclick="window.switchTab('shortlist')" id="tab-shortlist" class="py-3 px-3 border-b-2 border-orange-500 text-orange-400 font-medium flex items-center gap-1.5 transition-all">
      <i class="fa-solid fa-list-check"></i> Shortlist <span id="badge
